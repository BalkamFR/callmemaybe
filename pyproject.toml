[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Call Me Maybe - by papilaz"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "llm-sdk",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[tool.mypy]
python_version = "3.10"
exclude = [
    "^\\.venv",
    "^llm_sdk",
]
